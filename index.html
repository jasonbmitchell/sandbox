    /* ══════════ UTILS ══════════ */

    const MO = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const DS = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
    const p2 = n => String(n).padStart(2, "0");
    const fd = (y, m, d) => `${y}-${p2(m + 1)}-${p2(d)}`;
    const dim = (y, m) => new Date(y, m + 1, 0).getDate();
    const fdom = (y, m) => new Date(y, m, 1).getDay();
    const isWk = ds => { const d = new Date(ds + "T12:00:00"); return d.getDay() === 0 || d.getDay() === 6; };
    const dName = ds => ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][new Date(ds + "T12:00:00").getDay()];

    function expRange(s, e) {
      const out = [];
      let c = new Date(s + "T12:00:00");
      const end = new Date(e + "T12:00:00");
      while (c <= end) {
        out.push(`${c.getFullYear()}-${p2(c.getMonth() + 1)}-${p2(c.getDate())}`);
        c.setDate(c.getDate() + 1);
      }
      return out;
    }

    const fmtR = (s, e) => s === e ? s : `${s} → ${e}`;
    const rngCt = (s, e) => s === e ? 1 : Math.round((new Date(e + "T12:00:00") - new Date(s + "T12:00:00")) / 864e5) + 1;

    function shift(ds, dir, bo) {
      let d = new Date(ds + "T12:00:00");
      const delta = dir === "prior" ? -1 : 1;
      let moved = false;
      let n = 0;
      const f = dd => `${dd.getFullYear()}-${p2(dd.getMonth() + 1)}-${p2(dd.getDate())}`;
      while ((isWk(f(d)) || bo.has(f(d))) && n < 14) {
        d.setDate(d.getDate() + delta);
        moved = true;
        n++;
      }
      return { date: f(d), shifted: moved };
    }

    /* ══════════ MINI CALENDAR ══════════ */

    function MiniCal({ year, month, fedSet, firmSet, dlMap, calColor }) {
      const days = dim(year, month);
      const first = fdom(year, month);
      const cells = [];
      for (let i = 0; i < first; i++) cells.push(null);
      for (let d = 1; d <= days; d++) cells.push(d);
      const today = fd(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

      return (
        <div>
          <div style={{ fontSize: 11, fontWeight: 600, color: $.tx, marginBottom: 4 }}>
            {MO[month].slice(0, 3)}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 1 }}>
            {DS.map(d => (
              <div key={d} style={{ fontSize: 8, color: $.txM, textAlign: "center", fontWeight: 500 }}>{d}</div>
            ))}
            {cells.map((day, i) => {
              if (!day) return <div key={`e${i}`} />;
              const ds = fd(year, month, day);
              const isFed = fedSet?.has(ds);
              const isFirm = firmSet?.has(ds);
              const isDl = dlMap?.has(ds);
              const isTd = ds === today;
              const isW = isWk(ds);

              let bg = "transparent";
              let clr = $.tx;
              let brd = "2px solid transparent";
              let fw = 400;

              if (isTd) { bg = calColor || $.ac; clr = "#fff"; fw = 700; }
              else if (isDl) { brd = `2px solid ${calColor || $.ac}`; clr = calColor; fw = 600; }
              else if (isFed) { bg = $.rdBg; clr = $.rd; }
              else if (isFirm) { bg = $.ylBg; clr = $.yl; }
              else if (isW) { clr = $.txM; }

              return (
                <div key={ds} style={{
                  fontSize: 9, textAlign: "center", padding: "2px 0",
                  borderRadius: 3, background: bg, color: clr,
                  border: brd, fontWeight: fw, lineHeight: "16px",
                }}>
                  {day}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function FirmCalendar() {
      const [nav, setNav] = useState("calendars");
      const [tab, setTab] = useState("types");
      const [selCal, setSelCal] = useState("payroll");
      const [cals, setCals] = useState(INIT_CALS);
      const [firm, setFirm] = useState(INIT_CLOSURES);
      const [disFed, setDisFed] = useState(new Set());
      const [jewish, setJewish] = useState(false);
      const [closModal, setClosModal] = useState(false);
      const [calModal, setCalModal] = useState(null);
      const [pCal, setPCal] = useState("payroll");
      const [pDate, setPDate] = useState("2026-07-04");
      const [yr, setYr] = useState(2026);

      const fedH = FED_HOL[yr] || FED_HOL[2026];
      const fedSet = useMemo(() => { const s = new Set(); fedH.forEach(h => { if (!disFed.has(h.date)) s.add(h.date); }); return s; }, [fedH, disFed]);
      const firmSet = useMemo(() => { const s = new Set(); firm.forEach(c => expRange(c.startDate, c.endDate).forEach(d => s.add(d))); if (jewish) JEW_HOL.forEach(h => s.add(h.date)); return s; }, [firm, jewish]);
      const allBo = useMemo(() => { const s = new Set(); fedSet.forEach(d => s.add(d)); firmSet.forEach(d => s.add(d)); return s; }, [fedSet, firmSet]);

      const cal = cals.find(c => c.id === selCal);
      const pc = cals.find(c => c.id === pCal);
      const dlMap = useMemo(() => { const m = new Map(); if (cal?.id?.startsWith("tax")) { TAX_DL.filter(d => cal.id === "tax-individual" ? (d.type === "individual" || d.type === "both") : (d.type === "business" || d.type === "both")).forEach(d => m.set(d.date, d.label)); } return m; }, [cal]);
      const pr = shift(pDate, pc?.shift || "prior", allBo);
      const pLbl = allBo.has(pDate) ? [...fedH, ...firm.map(c => ({ date: c.startDate, label: c.label })), ...(jewish ? JEW_HOL : [])].find(h => h.date === pDate)?.label : isWk(pDate) ? "Weekend" : null;
      const closList = useMemo(() => { const l = firm.map(c => ({ ...c, src: "firm" })); if (jewish) JEW_HOL.forEach(h => l.push({ startDate: h.date, endDate: h.date, label: h.label, src: "religious" })); return l.sort((a, b) => a.startDate.localeCompare(b.startDate)); }, [firm, jewish]);
      const tplCt = useMemo(() => { const m = {}; cals.forEach(ct => { m[ct.id] = TMPLS.filter(t => t.cal === ct.id).length; }); return m; }, [cals]);

      const sTop = [
        { id: "company", label: "Company", icon: "company" },
        { id: "access", label: "Access and Permissions", icon: "access" },
        { id: "account", label: "Account Management", icon: "profile" },
        { id: "billing", label: "Billing Settings", icon: "billing" },
        { id: "calendars", label: "Calendars", icon: "calendar", isNew: true },
        { id: "branding", label: "Custom Branding", icon: "branding" },
        { id: "fields", label: "Custom Fields", icon: "fields" },
        { id: "docs", label: "Document Settings", icon: "docs" },
        { id: "experimental", label: "Experimental Features", icon: "experimental" },
        { id: "security", label: "Security", icon: "security" },

          </div>

          {closModal && <ClosureModal onAdd={c => setFirm(p => [...p, c].sort((a, b) => a.startDate.localeCompare(b.startDate)))} onClose={() => setClosModal(false)} />}
          {calModal && <CalTypeModal initial={calModal === "new" ? null : calModal} onSave={saveCal} onDelete={delCal} onClose={() => setCalModal(null)} />}
        </div>
      );
    }

    // 2. Render the app using the exact same function name
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FirmCalendar />); 

  </script>
</body>
</html>
