const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS_S = ["Su","Mo","Tu","We","Th","Fr","Sa"];

function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function firstDay(y,m){ return new Date(y,m,1).getDay(); }
function pad2(n){ return String(n).padStart(2,"0"); }
function fmtD(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function isWknd(ds){ const d=new Date(ds+"T12:00:00"); return d.getDay()===0||d.getDay()===6; }
function dayName(ds){ return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date(ds+"T12:00:00").getDay()]; }

function expandRange(startDate, endDate) {
  const dates = [];
  let cur = new Date(startDate + "T12:00:00");
  const end = new Date(endDate + "T12:00:00");
  while (cur <= end) {
    dates.push(`${cur.getFullYear()}-${pad2(cur.getMonth()+1)}-${pad2(cur.getDate())}`);
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}

function fmtRange(s, e) {
  if (s === e) return s;
  return `${s} → ${e}`;
}

function rangeDayCount(s, e) {
  if (s === e) return 1;
  const start = new Date(s + "T12:00:00");
  const end = new Date(e + "T12:00:00");
  return Math.round((end - start) / (1000*60*60*24)) + 1;
}

function shiftDate(ds, dir, blackouts){
  let d = new Date(ds+"T12:00:00");
  const delta = dir==="prior" ? -1 : 1;
  let shifted = false, n = 0;
  const fmt = dd => `${dd.getFullYear()}-${pad2(dd.getMonth()+1)}-${pad2(dd.getDate())}`;
  while((isWknd(fmt(d)) || blackouts.has(fmt(d))) && n < 14){
    d.setDate(d.getDate()+delta); shifted=true; n++;
  }
  return { date: fmt(d), shifted };
}

/* ═══════════════════════════════════════════════════════════════════════════
   MINI CALENDAR
   ═══════════════════════════════════════════════════════════════════════════ */

function MiniCal({ year, month, federalSet, firmSet, deadlines, calColor }) {
  const days=daysInMonth(year,month), fd=firstDay(year,month);
  const cells=[]; for(let i=0;i<fd;i++) cells.push(null); for(let d=1;d<=days;d++) cells.push(d);
  const today=fmtD(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());
  return (
    <div>
      <div style={{ fontSize:11, fontWeight:600, color:C.text, marginBottom:4 }}>{MONTHS[month].slice(0,3)}</div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(7, 1fr)", gap:1 }}>
        {DAYS_S.map(d=><div key={d} style={{ fontSize:8, color:C.textMut, textAlign:"center", fontWeight:500 }}>{d}</div>)}
        {cells.map((day,i)=>{
          if(!day) return <div key={`e${i}`}/>;
          const ds=fmtD(year,month,day);
          const isFed=federalSet?.has(ds);
          const isFirm=firmSet?.has(ds);
          const isDl=deadlines?.has(ds);
          const isWk=isWknd(ds);
          const isTd=ds===today;
          let bg="transparent", clr=C.text, brd="2px solid transparent", fw=400;
          if(isTd){ bg=calColor||C.accent; clr="#fff"; fw=700; }
          else if(isDl){ brd=`2px solid ${calColor||C.accent}`; clr=calColor; fw=600; }
          else if(isFed){ bg=C.redBg; clr=C.red; }
          else if(isFirm){ bg=C.yellowBg; clr=C.yellow; }
          else if(isWk){ clr=C.textMut; }
          return <div key={ds} style={{ fontSize:9, textAlign:"center", padding:"2px 0", borderRadius:3, background:bg, color:clr, border:brd, fontWeight:fw, lineHeight:"16px" }}>{day}</div>;
        })}
      </div>
    </div>
  );
}

  const fedHolidays = FEDERAL_HOLIDAYS_BY_YEAR[calYear] || FEDERAL_HOLIDAYS_BY_YEAR[2026];

  // Federal holidays set — only active (not disabled) ones
  const federalSet = useMemo(()=>{
    const s=new Set();
    fedHolidays.forEach(h=>{ if(!disFed.has(h.date)) s.add(h.date); });
    return s;
  },[fedHolidays, disFed]);

  // Firm closures set — includes firm custom closures + jewish holidays (NOT federal)
  const firmClosureSet = useMemo(()=>{
    const s=new Set();
    firm.forEach(c=>{ expandRange(c.startDate, c.endDate).forEach(d=>s.add(d)); });

    return m;
  },[cal]);

  const pr = shiftDate(pDate, pc?.shift||"prior", allBlackouts);
  const pHol = allBlackouts.has(pDate);

  const allHolList = [...fedHolidays, ...firm.map(c=>({date:c.startDate, label:c.label})), ...(jewish?JEWISH_HOLIDAYS:[])];

  const closList = useMemo(()=>{

  return (

        ))}
        <div style={{ flex:1 }}/>
        <div style={{ width:36,height:36,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",background:"#3D3F50",marginBottom:12 }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82.33v.09a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06c.5.5 1.21.71 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51c.61.38 1.32.17 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.61.88 1.04 1.51 1.08H21a2 2 0 1 1 0 4h-.09c-.63.04-1.25.47-1.51 1.08z"/></svg>
        </div>
      </div>

      <div style={{ marginLeft:52, display:"flex", minHeight:"100vh" }}>
        {/* Settings sidebar */}

                  <div style={{ fontSize:14,fontWeight:600 }}>Federal Holidays</div>
                  <span style={{ fontSize:11,color:C.textMut }}>Maintained by Canopy · Toggle off if your firm works that day</span>
                </div>
                <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:0 }}>

                      <div><div style={{ fontSize:13,fontWeight:500,textDecoration:off?"line-through":"none" }}>{h.label}</div><div style={{ fontSize:11,color:C.textMut }}>{h.date}</div></div>
                      <Toggle on={!off} onChange={()=>setDisFed(p=>{const n=new Set(p);off?n.delete(h.date):n.add(h.date);return n;})} size="sm"/>
                    </div>

              <div style={{ background:C.white,borderRadius:8,border:`1px solid ${C.border}`,padding:18,marginBottom:16 }}>
                <div style={{ fontSize:14,fontWeight:600,marginBottom:12 }}>Religious Holiday Packs</div>
                <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",borderRadius:6,border:`1px solid ${jewish?"#7C3AED40":C.border}`,background:jewish?"#F5F3FF":C.white }}>
                  <div><div style={{ fontSize:13,fontWeight:500 }}>Jewish Holidays 2026</div><div style={{ fontSize:12,color:C.textSec,marginTop:2 }}>Rosh Hashanah, Yom Kippur, Passover, Purim, Shavuot, Sukkot · {JEWISH_HOLIDAYS.length} dates</div></div>

              <div style={{ background:C.white,borderRadius:8,border:`1px solid ${C.border}`,padding:18 }}>
                <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12 }}>
                  <div style={{ fontSize:14,fontWeight:600 }}>Firm Closures</div>
                  <button onClick={()=>setModal(true)} style={{ padding:"6px 14px",borderRadius:6,border:`1px solid ${C.border}`,background:C.white,fontSize:12,cursor:"pointer",fontWeight:500,color:C.text }}>+ Add Closure</button>
                </div>
                {closList.length===0 && <div style={{ fontSize:13,color:C.textMut,padding:"8px 0" }}>No firm closures configured. Click "+ Add Closure" to add one.</div>}
                {closList.map((c,i)=>(
                  <div key={`${c.startDate}-${i}`} style={{ display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 14px",borderBottom:i<closList.length-1?`1px solid ${C.borderLt}`:"none" }}>
                    <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                      <span style={{ fontSize:10,padding:"2px 7px",borderRadius:4,background:c.src==="religious"?"#F5F3FF":C.yellowBg,color:c.src==="religious"?"#7C3AED":"#92400E",fontWeight:600 }}>{c.src==="religious"?"Religious":"Firm"}</span>
                      <div>
                        <span style={{ fontSize:13,fontWeight:500 }}>{c.label}</span>
                        <span style={{ fontSize:11,color:C.textMut,marginLeft:8 }}>
                          {fmtRange(c.startDate, c.endDate)}
                          {c.startDate !== c.endDate && <span style={{ marginLeft:4,color:C.accent,fontWeight:500 }}>({rangeDayCount(c.startDate,c.endDate)} days)</span>}
                          {c.recurring?" · Annual":""}

                  </div>
                ))}
              </div>
            </>)}

            {tab==="templates"&&(<>

              <div style={{ background:C.white,borderRadius:8,border:`1px solid ${C.border}`,overflow:"hidden" }}>
                <div style={{ display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1.2fr",padding:"10px 18px",background:C.bg,borderBottom:`1px solid ${C.border}` }}>
                  {["Template Name","Recurrence","Due Day","Calendar Type"].map(h=><div key={h} style={{ fontSize:11,fontWeight:600,color:C.textSec,textTransform:"uppercase",letterSpacing:"0.03em" }}>{h}</div>)}
                </div>
                {TEMPLATES.map((t,i)=>{const tc=CAL_TYPES.find(c=>c.id===t.cal); return (
                  <div key={t.id} style={{ display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1.2fr",padding:"11px 18px",borderBottom:i<TEMPLATES.length-1?`1px solid ${C.borderLt}`:"none",alignItems:"center" }}>
                    <div style={{ fontSize:13,fontWeight:500 }}>{t.name}</div>
                    <div style={{ fontSize:12,color:C.textSec }}>{t.recurrence}</div>
                    <div style={{ fontSize:12,color:C.textSec }}>{t.due}</div>
                    <div style={{ display:"flex",alignItems:"center",gap:6 }}><div style={{ width:7,height:7,borderRadius:"50%",background:tc?.color }}/><span style={{ fontSize:12,fontWeight:500,color:tc?.color }}>{tc?.name}</span></div>

              </div>

          </>) : (
            <div style={{ paddingTop:24 }}>
              <div style={{ fontSize:17,fontWeight:700,marginBottom:6 }}>{sideTop.find(s=>s.id===nav)?.label||"Settings"}</div>
              <p style={{ fontSize:13,color:C.textSec }}>Select <strong style={{ color:C.accent }}>Calendars</strong> in the sidebar to view the Firm Calendar prototype.</p>
            </div>
          )}
        </div>
      </div>
      {modal&&<AddClosureModal onAdd={c=>setFirm(p=>[...p,c].sort((a,b)=>a.startDate.localeCompare(b.startDate)))} onClose={()=>setModal(false)}/>}
    </div>
  );
}
